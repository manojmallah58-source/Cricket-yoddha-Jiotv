<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV Live Channels</title>
    <!-- HLS.js for Live Streaming Support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #111116;
            border-bottom: 1px solid #25252d;
            padding: 14px 20px;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            white-space: nowrap;
        }

        .logo span {
            color: #e50914;
        }

        /* Search */
        .search-box {
            width: 100%;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            background: #1b1b22;
            border: 1px solid #303039;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #e50914;
        }

        /* Filters */
        .filters {
            max-width: 1400px;
            margin: 15px auto 5px;
            padding: 0 20px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 5px;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            flex-shrink: 0;
            border: 1px solid #303039;
            background: #17171d;
            color: #ccc;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }

        /* Channel count */
        .channel-info {
            max-width: 1400px;
            margin: 15px auto 10px;
            padding: 0 20px;
            color: #999;
            font-size: 14px;
        }

        /* Grid */
        .channel-grid {
            max-width: 1400px;
            margin: auto;
            padding: 0 20px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }

        /* Card */
        .channel-card {
            background: #15151b;
            border: 1px solid #24242c;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #e50914;
        }

        .channel-logo {
            width: 100%;
            height: 120px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .channel-logo img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .channel-logo .placeholder {
            color: #777;
            font-size: 13px;
        }

        .channel-details {
            padding: 10px;
        }

        .channel-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-meta {
            margin-top: 6px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 10px;
            color: #aaa;
            background: #22222a;
            padding: 3px 6px;
            border-radius: 4px;
        }

        /* Video Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            width: 100%;
            max-width: 900px;
            background: #141419;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a35;
        }

        .modal-header {
            padding: 12px 15px;
            background: #1c1c24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Loading & Empty */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        /* Mobile Responsive adjustments */
        @media (max-width: 600px) {
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 0 12px 30px;
            }
            .header-inner {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo"><span>Jio</span>TV Live</div>
        <div class="search-box">
            <input type="search" id="search" placeholder="Search channels..." autocomplete="off">
        </div>
    </div>
</header>

<div class="filters">
    <div class="filter-row" id="genreFilters">
        <button class="filter-btn active" data-genre="all">All</button>
    </div>
</div>

<div class="channel-info">
    <span id="channelCount">Loading channels...</span>
</div>

<div id="loading" class="loading">
    <div class="spinner"></div>
    Loading channels...
</div>

<div id="channelGrid" class="channel-grid"></div>

<!-- Video Player Modal -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="playerTitle" class="modal-title">Channel Name</span>
            <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>
</div>

<script>
const DATA_URL = "https://gist.githubusercontent.com/mitthu786/6719418610aa81997e72d6c27a6a2e39/raw/tsjiotvnew.json";

let channels = [];
let activeGenre = "all";
let searchText = "";
let hls = null;

async function loadChannels() {
    const loading = document.getElementById("loading");
    try {
        const response = await fetch(DATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("Network response failed");
        
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Invalid JSON data format");

        channels = data;
        loading.style.display = "none";
        createGenreFilters();
        renderChannels();
    } catch (error) {
        loading.innerHTML = `<div style="font-size:30px;">⚠️</div><div>Unable to load channels. Try again later.</div>`;
    }
}

function createGenreFilters() {
    const container = document.getElementById("genreFilters");
    const genres = [...new Set(channels.map(c => c.genre).filter(Boolean))].sort();

    genres.forEach(genre => {
        const button = document.createElement("button");
        button.className = "filter-btn";
        button.textContent = genre;
        button.addEventListener("click", () => {
            activeGenre = genre;
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
            renderChannels();
        });
        container.appendChild(button);
    });
}

function cleanImageUrl(url) {
    if (!url) return "";
    url = String(url).trim();
    const markdown = url.match(/^\[.*?\]\((https?:\/\/[^)]+)\)$/);
    if (markdown) return markdown[1];
    return url.replace(/^\[/, "").replace(/\]$/, "");
}

function getFilteredChannels() {
    return channels.filter(channel => {
        const genreMatch = activeGenre === "all" || String(channel.genre || "").toLowerCase() === activeGenre.toLowerCase();
        const searchTarget = [channel.name, channel.link2, channel.genre, channel.lang].filter(Boolean).join(" ").toLowerCase();
        const searchMatch = !searchText || searchTarget.includes(searchText);
        return genreMatch && searchMatch;
    });
}

function renderChannels() {
    const grid = document.getElementById("channelGrid");
    const count = document.getElementById("channelCount");
    const filtered = getFilteredChannels();

    count.textContent = `${filtered.length} channel${filtered.length === 1 ? "" : "s"}`;
    grid.innerHTML = "";

    if (!filtered.length) {
        grid.innerHTML = `<div class="empty">No channels found.</div>`;
        return;
    }

    filtered.forEach(channel => {
        const card = document.createElement("div");
        card.className = "channel-card";
        
        card.addEventListener("click", () => {
            openPlayer(channel);
        });

        const imageUrl = cleanImageUrl(channel.img);
        const name = channel.link2 || channel.name || "Unknown Channel";
        const genre = channel.genre || "General";
        const language = channel.lang || "";

        card.innerHTML = `
            <div class="channel-logo">
                ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">` : ""}
                <div class="placeholder" style="${imageUrl ? "display:none" : ""}">No Logo</div>
            </div>
            <div class="channel-details">
                <div class="channel-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
                <div class="channel-meta">
                    <span class="tag">${escapeHtml(genre)}</span>
                    ${language ? `<span class="tag">${escapeHtml(language)}</span>` : ""}
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openPlayer(channel) {
    const modal = document.getElementById("playerModal");
    const playerTitle = document.getElementById("playerTitle");
    const video = document.getElementById("videoPlayer");
    
    const streamUrl = channel.link || channel.url || channel.streamUrl;
    const name = channel.link2 || channel.name || "Live Stream";

    if (!streamUrl) {
        alert("Stream link not available for this channel.");
        return;
    }

    playerTitle.textContent = name;
    modal.style.display = "flex";

    if (Hls.isSupported() && streamUrl.includes(".m3u8")) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.src = streamUrl;
        video.play();
    }
}

function closePlayer() {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("videoPlayer");
    modal.style.display = "none";
    video.pause();
    video.src = "";
    if (hls) {
        hls.destroy();
        hls = null;
    }
}

document.getElementById("closeModal").addEventListener("click", closePlayer);
window.addEventListener("click", (e) => {
    const modal = document.getElementById("playerModal");
    if (e.target === modal) closePlayer();
});

document.getElementById("search").addEventListener("input", function() {
    searchText = this.value.trim().toLowerCase();
    renderChannels();
});

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, '&#039;');
}

loadChannels();
</script>

</body>
</html>
